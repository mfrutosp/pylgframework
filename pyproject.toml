[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pylgframework"
version = "0.1.1"
description = "Local Group barycentre with propagated observational uncertainty (Monte Carlo)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moisés Frutos Plaza" }]
keywords = ["Local Group", "barycentre", "Monte Carlo", "astropy", "REBOUND"]
dependencies = ["numpy", "pandas", "astropy>=7.2"]

[project.urls]
Homepage = "https://github.com/mfrutosp/pylgframework"
Issues = "https://github.com/mfrutosp/pylgframework/issues"

[project.optional-dependencies]
rebound = ["rebound"]
analysis = ["scipy", "scikit-learn", "diptest", "matplotlib"]
test = ["pytest", "rebound"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: reproduces published values with N = 1000 (seconds to a minute)"]
testpaths = ["tests"]
